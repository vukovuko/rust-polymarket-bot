services:
  bot:
    build: .
    container_name: polymarket-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    # No ports exposed — bot only makes outbound connections
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
